<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메리 크리스마스 · 이브 파티 초대장</title>
  <meta name="description" content="2026년 12월 24일, 크리스마스 이브 파티에 초대합니다.">
  <meta property="og:title" content="메리 크리스마스 · 이브 파티 초대장">
  <meta property="og:description" content="2026년 12월 24일, 크리스마스 이브 파티에 초대합니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/christmas.css">
  <!-- JS가 켜져 있을 때만 스크롤 등장 효과 적용 -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <!-- 흩날리는 눈 (JS로 생성) -->
  <div class="snow" id="snow" aria-hidden="true"></div>

  <main class="page">

    <!-- 카드 앞면 -->
    <header class="cover" id="cover">
      <div class="cover__bg" aria-hidden="true">
        <img src="images/christmas-portrait.jpg" width="1080" height="1920" alt="">
      </div>
      <div class="cover__inner">
        <p class="cover__label" style="--d: .2s">Christmas Eve Party</p>
        <h1 class="cover__title" style="--d: .45s">Merry<br>Christmas</h1>
        <p class="cover__invite" style="--d: .9s" data-bind="eventName">크리스마스 이브 파티</p>
        <p class="cover__num" style="--d: 1.1s" data-bind="dateNum">2026. 12. 24</p>
      </div>
      <div class="cover__scroll" aria-hidden="true">Open</div>
    </header>

    <!-- 카드 속 메시지 -->
    <section class="section" id="greeting">
      <div class="reveal">
        <p class="section__eyebrow">Dear Friend</p>
        <h2 class="section__title">초대합니다</h2>
        <div class="ornament" aria-hidden="true"><span></span></div>
        <p class="greeting" data-bind="greeting">인사말</p>
        <p class="sign">From. <span data-bind="host">보내는 사람</span></p>
      </div>
    </section>

    <!-- D-Day -->
    <section class="section section--dark" id="dday">
      <div class="reveal">
        <p class="section__eyebrow">Count Down</p>
        <h2 class="section__title">D-Day</h2>
        <div class="ornament" aria-hidden="true"><span></span></div>
        <p class="dday__summary" id="dday-summary" aria-live="off">D-0</p>
        <div class="countdown" id="countdown" aria-live="off">
          <div class="countdown__item"><span class="countdown__num" id="cd-days">00</span><span class="countdown__unit">일</span></div>
          <div class="countdown__item"><span class="countdown__num" id="cd-hours">00</span><span class="countdown__unit">시간</span></div>
          <div class="countdown__item"><span class="countdown__num" id="cd-minutes">00</span><span class="countdown__unit">분</span></div>
          <div class="countdown__item"><span class="countdown__num" id="cd-seconds">00</span><span class="countdown__unit">초</span></div>
        </div>
        <p class="dday__message" id="dday-message"></p>
      </div>
    </section>

    <!-- 일시·장소 -->
    <section class="section" id="location">
      <div class="reveal">
        <p class="section__eyebrow">Location</p>
        <h2 class="section__title">일시 및 장소</h2>
        <div class="ornament" aria-hidden="true"><span></span></div>
        <p class="info"><strong data-bind="dateText">날짜</strong><br><span data-bind="timeText">시간</span></p>
        <p class="info"><strong data-bind="venueName">장소명</strong><br><span data-bind="address">주소</span></p>

        <div class="map">
          <iframe id="map-frame" class="map__frame" title="파티 장소 지도" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>

        <div class="actions">
          <a class="btn" id="link-naver" target="_blank" rel="noopener">네이버지도</a>
          <a class="btn" id="link-kakao" target="_blank" rel="noopener">카카오맵</a>
          <a class="btn" id="link-google" target="_blank" rel="noopener">구글지도</a>
          <button class="btn btn--ghost" id="copy-address" type="button">주소 복사</button>
        </div>
        <p class="toast" id="toast" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- 연락처 -->
    <section class="section section--tint" id="contact">
      <div class="reveal">
        <p class="section__eyebrow">Contact</p>
        <h2 class="section__title">연락처</h2>
        <div class="ornament" aria-hidden="true"><span></span></div>
        <div class="actions">
          <a class="btn" id="link-tel">전화하기</a>
          <a class="btn btn--ghost" id="link-sms">문자 보내기</a>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="ornament" aria-hidden="true"><span></span></div>
      <p class="footer__sign">Merry Christmas</p>
      <p data-bind="footer">따뜻한 연말 보내세요.</p>
    </footer>
  </main>

  <script src="js/christmas.js"></script>
</body>
</html>
